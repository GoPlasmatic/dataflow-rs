name: CI

on:
  push:
    branches: [main]
    # Neither README.md nor docs/** appear here on purpose. The Rust blocks in
    # both are compiled as doctests (ReadmeDoctests in src/lib.rs, and the
    # dataflow-docs-tests member for the book), so edits to either can break
    # the build and must run CI. Only files with no compiled content belong
    # in this list. (Anchored here, aliased under pull_request.)
    paths-ignore: &prose-only
      - 'CHANGELOG.md'
      - 'CLAUDE.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'LICENSE'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main]
    paths-ignore: *prose-only
  # A new RUSTSEC advisory lands against unchanged code, so the supply-chain
  # gate needs a trigger that does not depend on someone pushing. This also
  # catches stable-toolchain regressions in the other jobs.
  schedule:
    - cron: '0 6 * * 1'
  # Lets release.yml run this entire workflow as its pre-publish gate, so the
  # release gate is the same definition as PR CI and cannot drift narrower.
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      # `--workspace` so dataflow-wasm is covered too, and `--all-features` so
      # the `wasm-web` feature gets linted rather than silently skipped.
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-features --locked

  # The native job above builds dataflow-wasm for the host only. This job is
  # what actually exercises the wasm32 target, where uuid/chrono take different
  # code paths than they do natively.
  wasm:
    name: Wasm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-wasm-

      # Prebuilt binary, same as release.yml — seconds, versus a multi-minute
      # from-source `cargo install` on every cache miss.
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Run clippy (wasm32)
        run: |
          cargo clippy -p dataflow-rs --target wasm32-unknown-unknown \
            --features wasm-web -- -D warnings
          cargo clippy -p dataflow-wasm --target wasm32-unknown-unknown \
            --all-targets -- -D warnings

      # `--node` needs no browser driver; tests/web.rs is not browser-gated.
      - name: Run wasm tests
        run: wasm-pack test --node
        working-directory: wasm

  # `rust-version` in Cargo.toml is a promise to downstream consumers, and
  # nothing else in CI verifies it — the other jobs run stable. This caught the
  # crate having silently required 1.88 (let-chains) while advertising 1.85.
  msrv:
    name: MSRV (1.85)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust 1.85
        uses: dtolnay/rust-toolchain@1.85

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-msrv-

      # `--locked` so this checks the MSRV of the dependency versions we
      # actually ship, not whatever the resolver picks today. `--all-targets`
      # so examples and tests are held to the same bar as the library.
      - name: Check against MSRV
        run: cargo check --workspace --all-targets --all-features --locked

  # `ui/` is published to npm by release.yml, which runs `build:lib` for the
  # first time at publish time. Without this job a broken build (or a broken
  # type bundle, as in dataflow-ui v2.1.3) is only discovered after it ships.
  ui:
    name: UI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # Resolves @goplasmatic/dataflow-wasm from npm at the version pinned in
      # package.json rather than building it locally. That is enough to catch
      # UI-side build and typing regressions; release.yml is what validates the
      # UI against this release's freshly-built wasm.
      - name: Install dependencies
        run: npm ci
        working-directory: ui

      - name: Lint
        run: npm run lint
        working-directory: ui

      # `build:lib` is `tsc && vite build`, so this type-checks the whole
      # package as well as producing the artifact. Its `postbuild:lib` hook
      # (scripts/verify-dts.mjs) then fails the build if the declaration
      # bundle came out empty, so the guard covers every producer of the
      # artifact — this job, release.yml, and manual publishes alike.
      - name: Type-check and build library
        run: npm run build:lib
        working-directory: ui

  # Supply-chain gate: RUSTSEC advisories, license policy, and source policy,
  # all configured in deny.toml — the single source of truth, honored by the
  # action's default `check` command and by local `cargo deny check` runs.
  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2

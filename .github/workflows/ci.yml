name: CI

on:
  push:
    # `main` carries v4 from the freeze until 4.0.0, and `v3-maintenance`
    # carries 3.x fixes; both are tested. (Releases are tag-gated, not
    # branch-gated, so a 3.15.x tag on the maintenance branch still publishes.)
    branches: [main, v3-maintenance]
    # Neither README.md nor docs/** appear here on purpose. The Rust blocks in
    # both are compiled as doctests (ReadmeDoctests in docs-tests, and the
    # dataflow-docs-tests member for the book), so edits to either can break
    # the build and must run CI. Only files with no compiled content belong
    # in this list. (Anchored here, aliased under pull_request.)
    paths-ignore: &prose-only
      - 'CHANGELOG.md'
      - 'CLAUDE.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'LICENSE'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main, v3-maintenance]
    paths-ignore: *prose-only
  # A new RUSTSEC advisory lands against unchanged code, so the supply-chain
  # gate needs a trigger that does not depend on someone pushing. This also
  # catches stable-toolchain regressions in the other jobs.
  schedule:
    - cron: '0 6 * * 1'
  # Lets release.yml run this entire workflow as its pre-publish gate, so the
  # release gate is the same definition as PR CI and cannot drift narrower.
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Every job starts on a fresh runner, so incremental artifacts are written,
  # never read, and thrown away with the VM — 6.8 GB of the 25 GB `target/`
  # this workflow produces. Off is smaller and marginally faster for a build
  # that is always cold by construction.
  CARGO_INCREMENTAL: 0
  # Full debug info is the bulk of a test or example binary and nothing here
  # reads it: no debugger attaches, no core dumps are collected. Line tables
  # keep file-and-line in a panic backtrace, which is the only part a CI
  # failure actually needs, and dropping the rest speeds up linking.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Crate downloads only — `target/` is deliberately absent. This job
      # builds thirteen distinct feature configurations (all-features, default,
      # serde_json's `preserve_order`, and the family loop's ten entries in
      # isolation) across `--all-targets`, so its
      # `target/` reached 17 GB: `actions/cache` never prunes, and with
      # `restore-keys` every lockfile change restored the previous tree, added
      # another configuration's artifacts, and saved a larger superset.
      #
      # Measured on this workflow: a cold run compiled everything in 238 s; a
      # run with a warm 17 GB cache compiled in 221 s but spent 303 s
      # restoring it, and a key miss spent 684 s restoring plus 1662 s saving.
      # The cache bought ~17 s of compilation for five to thirty-nine minutes
      # of transfer, and at 17 GB against a 10 GB repository budget it evicted
      # the wasm, ui and msrv caches — which do pay for themselves — on every
      # run. The registry alone is ~200 MB and restores in seconds.
      #
      # The key prefix changed with this: a restore extracts the whole saved
      # archive regardless of `path`, so reusing `-cargo-` would have kept
      # pulling the 17 GB entry down.
      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-

      - name: Check formatting
        run: cargo fmt --all -- --check

      # `--workspace` so dataflow-wasm is covered too, and `--all-features` so
      # the `wasm-web` feature gets linted rather than silently skipped.
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-features --locked

      # Clippy does not lint rustdoc, so nothing above catches a broken
      # intra-doc link, a link from public docs into a private item, or an
      # unclosed HTML tag — all of which ship silently to docs.rs as dead or
      # mangled text. This crate's documentation is user-facing surface, so it
      # gets the same `-D warnings` treatment as the code.
      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --all-features --locked

      # Everything above is --all-features. These two steps are bare, with no
      # `--workspace` and no `-p`, on purpose: they compile the root the way
      # `cargo add dataflow-rs` delivers it. `--workspace` cannot: `wasm/`
      # depends on the root with `wasm-web` and `all-operators`, and cargo
      # unifies features across the members one invocation selects, so under
      # `--workspace` the root itself has every operator family on. Nor can
      # `-p dataflow-rs`: it is ambiguous beside the published 3.15.0 that
      # `corpus/v3`, `docs-tests` and the root's own dev-dependency pull in
      # (I156).
      - name: Run clippy (default features)
        run: cargo clippy --all-targets --locked -- -D warnings

      # No `--all-targets`: that flag suppresses doctests, and the crate's
      # doctests are user-facing claims that must hold in the default
      # configuration.
      - name: Run tests (default features)
        run: cargo test --locked

      # The README's and the book's Rust examples, in a default build. A single
      # `-p` builds the published 3.15.0 with its default features, so they
      # hold for a user who ran `cargo add dataflow-rs`, which `--workspace`
      # cannot show: there 3.15.0 has every family on, `tensor` and `budget`
      # included.
      - name: Run the README's and the book's doctests (default features)
        run: cargo test -p dataflow-docs-tests --locked

      # Orion's graph turns serde_json's `preserve_order` on, which unifies into
      # the engine: its key order must be its own in both builds.
      - name: Run tests (serde_json preserve_order)
        run: cargo test --features serde_json/preserve_order --locked

      # The golden corpus's v3 recordings, held against the published 3.15.0.
      # In the `--workspace --all-features` run above, it is `--all-features`
      # itself, through `corpus/v3`'s forwards, that turns every family on,
      # `tensor` and `budget` included, and that run covers the cases that
      # need one. This default-build step is the only run of the cases that
      # need a family off. It also catches a lock bump of 3.15.0's
      # dependencies (`datalogic-rs`, `serde_json`, `quick-xml`, `chrono`),
      # which can change v3's output though its source is fixed by checksum.
      - name: Run the corpus (default features)
        run: cargo test -p dataflow-corpus-v3 --locked

      # The engine's corpus driver reads the same cases as v3's. It checks that
      # the engine parses and compiles every definition as v3 built it, runs
      # every case as v3 recorded it (observer events included), and traces
      # every run as v3 did, compared by replay.
      - name: Run the corpus, v4 (default features)
        run: cargo test -p dataflow-corpus-v4 --locked

      # The corpus under Orion's `preserve_order`: the differential tests
      # compare against a v3 built the same way, so only the recordings, which
      # are fixed bytes, show an order that follows serde_json's map type. The
      # feature's `indexmap`, `hashbrown` and `equivalent` are not in
      # `Cargo.lock`, since no member turns it on, so this step's versions of
      # them float: a new release of one can turn it red with no commit behind
      # it.
      - name: Run the corpus, v4 (serde_json preserve_order)
        run: cargo test -p dataflow-corpus-v4 --features serde_json/preserve_order --locked

      # `--all-features` and the default build are the two endpoints; neither
      # catches a family that only compiles when another one is also on. The
      # list adds `tensor` (outside `all-operators`) and the `budget` knob.
      # v3's families run on `v3-maintenance`.
      - name: Test each operator family in isolation
        run: |
          set -euo pipefail
          for f in datetime ext-string ext-array ext-math ext-control ext-object \
                   error-handling all-operators tensor budget; do
            echo "::group::$f"
            cargo test --no-default-features --features "$f" --locked
            echo "::endgroup::"
          done

  # The native job above builds dataflow-wasm for the host only. This job is
  # what actually exercises the wasm32 target, where uuid/chrono take different
  # code paths than they do natively: `wasm-pack test --node` is the one run
  # of the engine on wasm32-unknown-unknown (ids through `uuid/js`,
  # `processed_at` through `chrono/wasmbind`, deadlines and timings through
  # `web-time`).
  wasm:
    name: Wasm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-wasm-

      # Prebuilt binary — seconds, versus a multi-minute from-source
      # `cargo install` on every cache miss. release.yml deliberately does pin
      # a version instead: this job only has to catch regressions, while that
      # one produces the artifact users install.
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Run clippy (wasm32)
        run: |
          cargo clippy -p dataflow-wasm --target wasm32-unknown-unknown \
            --all-targets -- -D warnings
          # No `--all-targets` for the root: its dev-dependency `tokio` has
          # `full`, which tokio refuses on wasm targets, so its tests and
          # examples do not build for wasm32 and only the library is linted.
          # `wasm-web` is the platform switch; `all-operators` adds datetime.
          cargo clippy --target wasm32-unknown-unknown --features wasm-web --locked -- -D warnings
          cargo clippy --target wasm32-unknown-unknown \
            --features wasm-web,all-operators --locked -- -D warnings

      # `--node` needs no browser driver; tests/web.rs is not browser-gated.
      - name: Run wasm tests
        run: wasm-pack test --node
        working-directory: wasm

      # A release-profile build, because the defect this guards against lives
      # in the release wasm-opt pass and a dev build would not show it. Catches
      # the regression on the PR rather than at `git tag` time, when the only
      # remedy is a failed release.
      - name: Build and verify the release wasm artifact
        run: |
          wasm-pack build --target web --out-dir pkg --release
          node scripts/verify-wasm.mjs pkg
        working-directory: wasm

  # `rust-version` in Cargo.toml is a promise to downstream consumers, and
  # nothing else in CI verifies it — the other jobs run stable. This caught the
  # crate having silently required 1.88 (let-chains) while advertising 1.85.
  #
  # The floor is 1.98: `datalogic-rs` 5.7 and `datavalue-rs` 0.3.1 both declare
  # `rust-version = "1.98"`, so it is inherited, not chosen.
  msrv:
    name: MSRV (1.98)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust 1.98
        uses: dtolnay/rust-toolchain@1.98

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-msrv-

      # `--locked` so this checks the MSRV of the dependency versions we
      # actually ship, not whatever the resolver picks today. `--all-targets`
      # so examples and tests are held to the same bar as the library.
      - name: Check against MSRV
        run: cargo check --workspace --all-targets --all-features --locked

  # `ui/` is published to npm by release.yml, which runs `build:lib` for the
  # first time at publish time. Without this job a broken build (or a broken
  # type bundle, as in dataflow-ui v2.1.3) is only discovered after it ships.
  ui:
    name: UI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # Builds the engine from this checkout instead of resolving it from npm.
      # Resolving from npm cannot work in general: a UI change that uses a wasm
      # export added in the same commit has no published engine to compile
      # against, and the release that would publish one is gated on this job.
      # release.yml is the counterpart — it validates the UI against the engine
      # it has just published, which is what consumers actually install.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-ui-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-ui-

      # Prebuilt binary, as in the `wasm` job. release.yml pins a version
      # instead, because that job produces the artifact users install; this one
      # only has to catch regressions.
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install dependencies
        run: npm ci
        working-directory: ui

      # Builds ../wasm, refuses to proceed if verify-wasm.mjs rejects the
      # binary, then overlays the glue, the binary and the type declarations
      # onto the package npm ci just installed.
      - name: Overlay this checkout's engine
        run: npm run wasm:local
        working-directory: ui

      - name: Lint
        run: npm run lint
        working-directory: ui

      # vitest, against the engine overlaid above: the trace helpers over real
      # runs, and the debugger rendering a failing run (the exit criterion the
      # package's build alone cannot show).
      - name: Test
        run: npm test
        working-directory: ui

      # `build:lib` is `tsc && vite build`, so this type-checks the whole
      # package as well as producing the artifact. Its `postbuild:lib` hook
      # (scripts/verify-dts.mjs) then fails the build if the declaration
      # bundle came out empty, so the guard covers every producer of the
      # artifact — this job, release.yml, and manual publishes alike.
      - name: Type-check and build library
        run: npm run build:lib
        working-directory: ui

  # Supply-chain gate: RUSTSEC advisories, license policy, and source policy,
  # all configured in deny.toml — the single source of truth, honored by the
  # action's default `check` command and by local `cargo deny check` runs.
  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2

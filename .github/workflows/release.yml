name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Cargo.toml version: $VERSION"

      - name: Validate tag matches version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          VERSION="${{ steps.version.outputs.version }}"
          if [ "$TAG_VERSION" != "$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $VERSION"
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches Cargo.toml version $VERSION"

  # The full PR gate — fmt/clippy/tests, wasm32, MSRV, UI build, cargo-deny —
  # invoked as a reusable workflow, so the release gate is the same definition
  # as PR CI and structurally cannot drift narrower than it.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  publish-crate:
    name: Publish to crates.io
    needs: [validate, ci]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check if version exists on crates.io
        id: check
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          HTTP_CODE=$(curl -sS -H 'User-Agent: dataflow-rs-release-check' \
            -o /dev/null -w '%{http_code}' \
            "https://crates.io/api/v1/crates/dataflow-rs/$VERSION")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "Version $VERSION already published to crates.io, skipping"
            echo "skip=true" >> $GITHUB_OUTPUT
          elif [ "$HTTP_CODE" = "404" ]; then
            echo "Publishing version $VERSION to crates.io"
            echo "skip=false" >> $GITHUB_OUTPUT
          else
            echo "::error::Unexpected HTTP $HTTP_CODE from crates.io API"
            exit 1
          fi

      # `--locked` so the published build resolves exactly the tracked
      # Cargo.lock that the validate job tested against.
      - name: Publish
        if: steps.check.outputs.skip != 'true'
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}

  publish-wasm:
    name: Publish WASM to npm
    needs: [validate, ci]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # Pinned, and deliberately not the `| sh` installer: that tracks whatever
      # wasm-pack is latest on the day of the release, which is how the
      # toolchain drifted unnoticed in the first place. wasm-pack fetches a
      # matching binaryen itself, so no system binaryen is installed — an
      # apt-provided one is old enough to mishandle the externref table.
      - name: Install wasm-pack (pinned)
        run: cargo install wasm-pack --version 0.14.0 --locked

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            wasm/target/
          key: ${{ runner.os }}-wasm-${{ hashFiles('wasm/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-wasm-

      - name: Build WASM
        run: |
          cd wasm
          wasm-pack build --target web --out-dir pkg --release

      # No separate wasm-opt step: optimization is declared once in
      # wasm/Cargo.toml under [package.metadata.wasm-pack.profile.release], so
      # a local build, docs.yml and this job all produce the same binary. The
      # old second pass here ran with different flags and no
      # --enable-reference-types.

      - name: Generate package.json
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          cd wasm/pkg
          cat > package.json << EOF
          {
            "name": "@goplasmatic/dataflow-wasm",
            "type": "module",
            "author": "Plasmatic Engineering <shankar@goplasmatic.io>",
            "description": "WebAssembly bindings for the dataflow-rs rules engine",
            "version": "$VERSION",
            "license": "Apache-2.0",
            "homepage": "https://github.com/GoPlasmatic/dataflow-rs",
            "repository": {
              "type": "git",
              "url": "https://github.com/GoPlasmatic/dataflow-rs",
              "directory": "wasm"
            },
            "bugs": {
              "url": "https://github.com/GoPlasmatic/dataflow-rs/issues"
            },
            "files": [
              "dataflow_wasm_bg.wasm",
              "dataflow_wasm.js",
              "dataflow_wasm.d.ts",
              "README.md"
            ],
            "main": "dataflow_wasm.js",
            "types": "dataflow_wasm.d.ts",
            "sideEffects": [
              "./snippets/*"
            ],
            "keywords": ["rules-engine", "ifttt", "wasm", "webassembly", "dataflow", "rust"]
          }
          EOF
          cp ../../README.md ./README.md

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # The last gate before the artifact leaves the machine. `wasm-pack build`
      # exits 0 for a binary that cannot initialize in a browser, and npm will
      # happily publish it — that is how every release from 2.1.3 to 3.2.0
      # shipped broken. This asserts the externref table can grow and that the
      # glue and binary come from the same build.
      - name: Verify WASM artifact
        run: cd wasm && node scripts/verify-wasm.mjs pkg

      - name: Check if version exists on npm
        id: check
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          if npm view "@goplasmatic/dataflow-wasm@$VERSION" version 2>/dev/null; then
            echo "Version $VERSION already published to npm, skipping"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "Publishing version $VERSION to npm"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish to npm
        if: steps.check.outputs.skip != 'true'
        run: cd wasm/pkg && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Upload wasm-pkg artifact
        uses: actions/upload-artifact@v7
        with:
          name: wasm-pkg
          path: wasm/pkg/

  publish-ui:
    name: Publish UI to npm
    needs: [validate, publish-wasm]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download wasm-pkg artifact
        uses: actions/download-artifact@v8
        with:
          name: wasm-pkg
          path: wasm/pkg/

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Sync UI version from Cargo.toml
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          cd ui && npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: cd ui && npm ci

      - name: Copy local WASM build
        run: |
          cp wasm/pkg/dataflow_wasm.js ui/node_modules/@goplasmatic/dataflow-wasm/
          cp wasm/pkg/dataflow_wasm_bg.wasm ui/node_modules/@goplasmatic/dataflow-wasm/

      - name: Build UI library
        run: cd ui && npm run build:lib

      # The repo pins the dataflow-wasm dep at the last *published* version so
      # `npm ci` above can resolve the lockfile (this release's wasm build is
      # copied over node_modules instead). Stamp the published package.json
      # with this release's version so dataflow-ui@X internally refers to
      # dataflow-wasm@^X — publish-wasm has already published it by now.
      - name: Sync dataflow-wasm dep to release version
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          cd ui && npm pkg set "dependencies.@goplasmatic/dataflow-wasm=^$VERSION"

      - name: Check if version exists on npm
        id: check
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          if npm view "@goplasmatic/dataflow-ui@$VERSION" version 2>/dev/null; then
            echo "Version $VERSION already published to npm, skipping"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "Publishing version $VERSION to npm"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish to npm
        if: steps.check.outputs.skip != 'true'
        run: cd ui && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    name: Create GitHub Release
    needs: [validate, publish-crate, publish-wasm, publish-ui]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create release
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --generate-notes \
            --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}

version: 2

updates:
  # Root crate + the dataflow-wasm workspace member share one lockfile, so a
  # single cargo entry covers both.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Patch/minor bumps are the bulk of the noise and are what the v3.0.3 and
      # v3.0.4 manual refreshes were doing by hand. Batch them into one PR.
      cargo-minor-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: npm
    directory: "/ui"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # Version-locked to the Rust crate by the release workflow, not by
      # dependabot. See the "Sync dataflow-wasm dep" step in release.yml.
      - dependency-name: "@goplasmatic/dataflow-wasm"
      # TypeScript 7 (the native compiler) drops the JS Compiler API, and
      # typescript-eslint peer-caps at <6.1.0 — adopting it breaks the lint
      # gate. Remove this once typescript-eslint supports TS7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    ignore:
      # The tag on dtolnay/rust-toolchain selects the *Rust toolchain* to
      # install (stable, 1.85, ...), not an action version. The @1.85 pin is
      # this crate's MSRV and must only change together with `rust-version`
      # in Cargo.toml — never via a dependency bump (see closed PR #19).
      - dependency-name: "dtolnay/rust-toolchain"
    commit-message:
      prefix: "chore(ci)"

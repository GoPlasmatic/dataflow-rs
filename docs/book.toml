[book]
title = "dataflow-rs Documentation"
authors = ["Plasmatic"]
description = "Lightweight, rule-driven workflow engine for data processing pipelines"
language = "en"
src = "src"

[build]
build-dir = "book"

# The book's ```rust blocks are compiled by the `dataflow-docs-tests` crate
# (`cargo test -p dataflow-docs-tests`), which links them with Cargo's full
# dependency set; this sets the edition metadata to match the workspace.
[rust]
edition = "2024"

[output.html]
git-repository-url = "https://github.com/GoPlasmatic/dataflow-rs"
default-theme = "light"
preferred-dark-theme = "navy"
edit-url-template = "https://github.com/GoPlasmatic/dataflow-rs/edit/main/docs/{path}"
additional-js = ["theme/dataflow-playground.js"]
additional-css = ["theme/dataflow-playground.css"]

[output.html.fold]
enable = true
level = 1

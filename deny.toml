# cargo-deny configuration — see https://embarkstudios.github.io/cargo-deny/
#
# Run locally with:
#   cargo install cargo-deny --locked
#   cargo deny check

[graph]
all-features = true

[advisories]
# Fail on any unmaintained/vulnerable crate in the tree. v3.0.3 was a manual
# response to RUSTSEC-2026-0194/0195; this job is what catches the next one.
yanked = "deny"

[licenses]
# The dependency tree is uniformly permissive today. Anything outside this set
# is a deliberate decision, so make it fail loudly rather than slip in.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.93

[bans]
# Duplicate versions are common and mostly harmless in a tree this size; warn
# so they stay visible without blocking releases on a transitive dep's choices.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

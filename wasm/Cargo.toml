[package]
name = "dataflow-wasm"
version.workspace = true
edition = "2024"
license = "Apache-2.0"
description = "WebAssembly bindings for the dataflow-rs rules engine"
authors = ["Plasmatic Engineering <shankar@goplasmatic.io>"]
repository = "https://github.com/GoPlasmatic/dataflow-rs"
keywords = ["rules-engine", "ifttt", "wasm", "webassembly"]
categories = ["wasm", "development-tools"]
# Ships through npm as `@goplasmatic/dataflow-wasm`, never through crates.io:
# a `cargo publish --workspace` must not upload it.
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# One explicit wasm-opt pass, shared by every builder — a local `wasm-pack
# build`, docs.yml and release.yml — rather than wasm-pack's default followed
# by a second ad-hoc pass in CI with different flags.
#
# `--enable-reference-types` is load-bearing, not decoration. The glue's
# `__wbindgen_init_externref_table` unconditionally calls `table.grow(4)`; a
# binaryen that processes this module without reference-types rewrites the
# externref table with `maximum == initial`, so that grow throws RangeError on
# the very first init and the package is dead on arrival in every browser.
# `scripts/verify-wasm.mjs` fails the build if that ever regresses.
[package.metadata.wasm-pack.profile.release]
wasm-opt = [
    "-Oz",
    "--enable-reference-types",
    "--enable-bulk-memory",
    "--enable-nontrapping-float-to-int",
    "--enable-sign-ext",
]

[dependencies]
# The root crate, v4, at the root's version.
# `wasm-web` is the browser's clock and randomness, which wasm32-unknown-unknown
# needs. `datetime` on the dependency line, not via `--features` at release
# time, so `wasm-pack test` and any from-source build get the same operator set
# the published npm artifact has; `WasmEngine` turns every standard family on
# through `ExprEngineBuilder::all_operators`. `tensor` stays off: its operator
# names (`shape`, `cast`, `concat`) are ordinary JSON keys in workflows that
# already ship.
dataflow-rs = { workspace = true, features = ["wasm-web", "datetime"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
console_error_panic_hook = "0.1"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[lints]
workspace = true

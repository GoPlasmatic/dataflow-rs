[package]
name = "dataflow-corpus"
# Never published, consumed only by path, so not part of the release bump.
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
publish = false
license = "Apache-2.0"
description = "The corpus: workflow cases the engine's tests load, their format, and the tools that read them. Not published."

# Deliberately free of `dataflow-rs`, so its path and replay models are
# independent of the engine the tests hold to them.
[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lints]
workspace = true

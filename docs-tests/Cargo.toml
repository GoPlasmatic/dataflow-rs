[package]
name = "dataflow-docs-tests"
# Deliberately not the workspace version: this crate is never published and is
# consumed only by path, so it is not part of the four-artifact release bump.
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
publish = false
license = "Apache-2.0"
description = "Compiles the Rust examples in docs/src as doctests. Not published."

# This crate exists only to hold doctests. It deliberately lives outside the
# `dataflow-rs` package: `docs/` is not shipped in the published `.crate`
# archive (see the root `include` list), so a `include_str!("../docs/...")`
# in `src/lib.rs` would reference a file absent for crate consumers.
[lib]
test = false # no unit tests to harness; the doctests are the whole point

[dependencies]
# The root crate, v4: every page's and the README's Rust example compiles
# against the engine at the root, in its default build.
dataflow-rs = { path = ".." }

[dev-dependencies]
env_logger = "0.11"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }

[lints]
workspace = true

[package]
name = "dataflow-rs-v4"
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
publish = false
description = "dataflow-rs v4, under construction beside v3"

[features]
default = []
datetime = ["datalogic-rs/datetime"]
ext-string = ["datalogic-rs/ext-string"]
ext-array = ["datalogic-rs/ext-array"]
ext-math = ["datalogic-rs/ext-math"]
ext-control = ["datalogic-rs/ext-control"]
ext-object = ["datalogic-rs/ext-object"]
error-handling = ["datalogic-rs/error-handling"]
all-operators = [
    "datetime",
    "ext-string",
    "ext-array",
    "ext-math",
    "ext-control",
    "ext-object",
    "error-handling",
]
tensor = ["datalogic-rs/tensor", "datavalue/tensor"]
budget = ["datalogic-rs/budget"]
# A platform switch, as v3's: the three crates' browser clocks and randomness,
# which wasm32 needs and native targets must not pull in.
wasm-web = ["chrono/wasmbind", "uuid/js", "datalogic-rs/wasm-clock"]
# The TypeScript declarations of the wire shapes (I133), which
# `tests/ts_types.rs` renders into `bindings/dataflow.d.ts`. Off by default.
ts = ["dep:ts-rs"]

[dependencies]
# `rc`: serde's impls for `Arc<str>`, which ids and change paths are held as.
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
datalogic-rs = { version = "5.7", features = ["serde_json", "templating"] }
datavalue = { package = "datavalue-rs", version = "0.3.1", features = ["serde", "serde_json"] }
# `Instant` that works on wasm32; `std::time::Instant` natively (I86).
web-time = "1.1"
bumpalo = "3.20"
self_cell = "1.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
dataflow-rs-derive = { path = "../derive" }
uuid = { version = "1.26", default-features = false, features = ["v7", "std"] }
# The `log` built-in's target, and `map`'s failing-mapping lines (I73).
log = "0.4"
# `parse_xml` and `publish_xml`, at v3's requirement.
quick-xml = { version = "0.42", features = ["serialize"] }
# A fan-out's bounded concurrent calls (`FuturesUnordered`), without spawning,
# so the calls may borrow the run view and run on wasm. At v3's requirement.
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
# The `ts` feature's derives, with its default `serde-compat`, so a
# `skip_serializing_if` field reads as optional and a `rename` is honoured.
ts-rs = { version = "12.0.1", optional = true, features = ["no-serde-warnings"] }

# Native-only: a thread-local PRNG instead of one `getrandom` per id, as v3 does.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
uuid = { version = "1.26", default-features = false, features = ["fast-rng"] }
# Native-only: a host call's race against the run's deadline and token (I92),
# with the timer, the token's `Notify` and `select!`. On wasm only the checks run.
tokio = { version = "1", default-features = false, features = ["time", "sync", "macros"] }

[lints]
workspace = true

[dev-dependencies]
dataflow-corpus = { path = "../corpus" }
# v3, the root package, for the differential tests that hold v4 to its rules.
dataflow_rs_v3 = { package = "dataflow-rs", path = ".." }
# v3's handler trait, for the twins `tests/fan_out.rs` and
# `examples/v4_host_call_floor.rs` register on v3.
async-trait = "0.1"
tokio = { version = "1", features = ["full", "test-util"] }
# The gate's ports (`examples/v4_*.rs`), at the versions v3's examples use.
futures = "0.3"
env_logger = "0.11"
num_cpus = "1.17"

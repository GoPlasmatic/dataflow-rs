[package]
name = "dataflow-rs-derive"
version.workspace = true
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
description = "The derive behind dataflow-rs's host function configs: #[derive(FunctionConfig)]"
authors = ["Plasmatic Engineering <shankar@goplasmatic.io>"]
repository = "https://github.com/GoPlasmatic/dataflow-rs"
readme = "README.md"
keywords = ["dataflow", "derive", "proc-macro", "workflow", "config"]
categories = ["development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dependencies]
syn = { version = "3", default-features = false, features = ["derive", "parsing", "printing", "proc-macro"] }
quote = "1"
proc-macro2 = "1"
# Parses a `default_json` at expansion, so a malformed one is a compile error.
serde_json = "1.0"

[lints]
workspace = true

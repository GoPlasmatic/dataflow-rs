[package]
name = "dataflow-rs"
version = "4.0.0-dev"
edition = "2024"
rust-version = "1.98"
# Allowlist of what ships in the published .crate: the library, the TypeScript
# declarations of its wire shapes (`bindings/`), and the user-facing root docs.
# The tests and examples stay in the repository: they need crates that are not
# published (the corpus) and the gate's shared files.
include = [
    "/src",
    "/bindings",
    "/README.md",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/SECURITY.md",
    "/LICENSE",
]
authors = ["Plasmatic Engineering <shankar@goplasmatic.io>"]
license = "Apache-2.0"
description = "A lightweight rules engine for building IFTTT-style automation and data processing pipelines in Rust. Define rules with JSONLogic conditions, execute actions, and chain workflows."
repository = "https://github.com/GoPlasmatic/dataflow-rs"
keywords = ["rules-engine", "ifttt", "automation", "jsonlogic", "workflow"]
categories = ["data-structures", "development-tools", "config"]

# docs.rs renders the operator families so their operator docs resolve, plus
# `budget`. `wasm-web` (a platform switch) and `ts` (a generator) are not API.
[package.metadata.docs.rs]
features = ["all-operators", "budget"]

[features]
default = []

# Optional `datalogic-rs` operator families, each forwarding to the identically
# named feature there. Off by default, and enabling one is *not* a no-op for
# existing workflows: the engine evaluates in templating mode, where an unknown
# operator name passes through as literal data, so a `{"length": ...}` value
# starts evaluating once `ext-string` is on (`{"$length": ...}` pins the
# literal). `datetime` also changes `==` and the ordering operators on plain
# date-shaped strings. `error-handling` is JSONLogic's `try`/`throw`, not the
# engine's own error handling.
datetime = ["datalogic-rs/datetime"]
ext-string = ["datalogic-rs/ext-string"]
ext-array = ["datalogic-rs/ext-array"]
ext-math = ["datalogic-rs/ext-math"]
ext-control = ["datalogic-rs/ext-control"]
ext-object = ["datalogic-rs/ext-object"]
error-handling = ["datalogic-rs/error-handling"]
# Every family above. Not datalogic's `flagd`, which is feature-flag specific
# and the one family with an extra dependency.
all-operators = [
    "datetime",
    "ext-string",
    "ext-array",
    "ext-math",
    "ext-control",
    "ext-object",
    "error-handling",
]
# The `Tensor` value and its 20 operators. Deliberately not in `all-operators`:
# names like `shape`, `full`, `cast` and `concat` are ordinary JSON keys, which
# a live operator would start evaluating.
tensor = ["datalogic-rs/tensor", "datavalue/tensor"]
# The per-evaluation operation ceiling: a config knob, not a family. Costs an
# add-and-compare per dispatched node whether or not a ceiling is set.
budget = ["datalogic-rs/budget"]
# A platform switch: the browser's clock and randomness, which
# wasm32-unknown-unknown needs and native targets must not pull in.
wasm-web = ["chrono/wasmbind", "uuid/js", "datalogic-rs/wasm-clock"]
# Derives `ts_rs::TS` on the wire shapes, from which `tests/ts_types.rs`
# renders `bindings/dataflow.d.ts`, which ships in the package. **Outside
# semver:** the wire shapes are covered by semver, but the generator, its
# output's layout and this feature's dependencies may change in any release.
ts = ["dep:ts-rs"]

[dependencies]
# `rc`: serde's impls for `Arc<str>`, which ids and change paths are held as.
serde = { version = "1.0", features = ["derive", "rc"] }
# `float_roundtrip`: a float reads back as the bits it was written from, so a
# message and a trace v4 writes read back byte for byte. The default
# parser can land one ULP off on a 17-digit float, which arithmetic makes.
# `preserve_order`: an object keeps its keys in the order they were written,
# so a definition's documents (a Mongo `$sort`, a projection) render as
# authored and its issues come out in its order, in every host's build. A
# host's `serde_json::Map` keeps insertion order with it.
serde_json = { version = "1.0", features = ["float_roundtrip", "preserve_order"] }
datalogic-rs = { version = "5.8.2", features = ["serde_json", "templating"] }
datavalue = { package = "datavalue-rs", version = "0.3.2", features = ["serde", "serde_json"] }
# `Instant` that works on wasm32; `std::time::Instant` natively.
web-time = "1.1"
bumpalo = "3.20"
self_cell = "1.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
dataflow-rs-derive = { path = "derive", version = "=4.0.0-dev" }
uuid = { version = "1.26", default-features = false, features = ["v7", "std"] }
# The `log` built-in's target, and `map`'s failing-mapping lines.
log = "0.4"
# `parse_xml` and `publish_xml`, at v3's requirement.
quick-xml = { version = "0.42", features = ["serialize"] }
# A fan-out's bounded concurrent calls (`FuturesUnordered`), without spawning,
# so the calls may borrow the run view and run on wasm. At v3's requirement.
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
# The `ts` feature's derives, with its default `serde-compat`, so a
# `skip_serializing_if` field reads as optional and a `rename` is honoured.
ts-rs = { version = "12.0.1", optional = true, features = ["no-serde-warnings"] }

# Native-only: a thread-local PRNG instead of one `getrandom` per id, as v3 does.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
uuid = { version = "1.26", default-features = false, features = ["fast-rng"] }
# Native-only: a host call's race against the run's deadline and token,
# with the timer, the token's `Notify` and `select!`. On wasm only the checks run.
tokio = { version = "1", default-features = false, features = ["rt", "time", "sync", "macros"] }

[lints]
workspace = true

[dev-dependencies]
dataflow-corpus = { path = "corpus" }
tokio = { version = "1", features = ["full", "test-util"] }
# The gate's benchmarks (`examples/*.rs`).
futures = "0.3"
env_logger = "0.11"
num_cpus = "1.17"

# The integration suite is `tests/it/` (one binary, a module per topic) and
# `tests/secrets_isolation.rs`, both discovered; `ts_types` builds only with
# the `ts` feature it tests, rather than as an empty binary.
[[test]]
name = "ts_types"
required-features = ["ts"]

[workspace]
members = [".", "wasm", "docs-tests", "corpus", "derive"]

# Lint policy lives here rather than only in the CI command line, so a local
# `cargo clippy` and rust-analyzer enforce exactly what CI does. CI still passes
# `-D warnings`, which is what turns these into errors there.
[workspace.lints.clippy]
# Spell the type as `Self` inside its own `impl`. Was inconsistent across the
# crate — most modules already did, `config.rs` and `error.rs` did not.
use_self = "warn"

# Native release profile: maximize throughput. `lto = "fat"` plus
# `codegen-units = 1` lets the compiler propagate inlining across crate
# boundaries — load-bearing for the JSONLogic eval hot path.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

# WASM-specific override: keep the size-optimized build for `dataflow-wasm`
# (the cdylib produces a smaller `.wasm` artifact with `opt-level = "s"`).
# Native consumers of `dataflow-rs` get `opt-level = 3` above.
[profile.release.package.dataflow-wasm]
opt-level = "s"
